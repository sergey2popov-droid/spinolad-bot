<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Целебник — рабочий прототип</title>
  <style>
    :root {
      --ink: #17201b;
      --muted: #66736d;
      --line: #dce4dd;
      --leaf: #2f6b4f;
      --leaf-dark: #1f4b3a;
      --paper: #fbf8ef;
      --user: #dcf6c8;
      --bot: #fff;
      --warn: #fff1e9;
      --warn-line: #b04434;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #edf2ea;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #dcead8;
      position: relative;
      box-shadow: 0 0 40px rgba(23, 32, 27, .12);
    }

    header {
      padding: 14px 16px;
      color: #fff;
      background: var(--leaf-dark);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .avatar {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff7df;
      color: var(--leaf-dark);
      font-weight: 900;
      font-size: 22px;
    }

    h1 {
      margin: 0 0 2px;
      font-size: 18px;
      letter-spacing: 0;
    }

    header p {
      margin: 0;
      color: #d7eadc;
      font-size: 12px;
    }

    main {
      padding: 14px 12px 120px;
    }

    .bubble {
      max-width: 92%;
      margin: 8px 0;
      padding: 11px 12px;
      border-radius: 15px;
      background: var(--bot);
      box-shadow: 0 4px 16px rgba(23, 32, 27, .07);
      line-height: 1.38;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .bubble.user {
      margin-left: auto;
      background: var(--user);
      white-space: normal;
    }

    .quick {
      display: grid;
      gap: 8px;
      margin: 10px 0 14px;
      max-width: 92%;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 10px;
      color: #fff;
      background: #4f9a77;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      color: var(--leaf-dark);
      background: #eef7ec;
      border: 1px solid #cfe3cf;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0;
    }

    .suggestions button {
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 13px;
      background: #fff;
      color: var(--leaf-dark);
      border: 1px solid var(--line);
    }

    .composer {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(480px, 100%);
      padding: 10px;
      background: rgba(255, 255, 255, .94);
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 8px;
      border-top: 1px solid var(--line);
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      outline: 0;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    .send {
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      margin: 6px 0 0 2px;
    }

    a { color: var(--leaf-dark); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">Ц</div>
      <div>
        <h1>Целебник</h1>
        <p>Здоровье и энергия доступные всем</p>
      </div>
    </header>

    <main id="chat">
      <div class="bubble">
Целебник

Помогаю восстанавливать и поддерживать здоровье с помощью продуктов, трав, напитков, народных рецептов, простых действий и современных исследований.

Напишите запрос своими словами.
      </div>
      <div class="quick">
        <button data-query="болит желудок">Что болит?</button>
        <div class="row">
          <button data-query="лен">Целебные средства</button>
          <button data-query="упражнения для ног">Упражнения</button>
        </div>
      </div>
      <div class="suggestions" id="suggestions"></div>
      <p class="status" id="status">Примеры: сахар скачет, ПМС, сон, ромашка, дыхание 4/8</p>
    </main>

    <form class="composer" id="form">
      <input id="input" autocomplete="off" placeholder="Напишите запрос">
      <button class="send" type="submit">›</button>
    </form>
  </div>

  <script>
    const chat = document.querySelector("#chat");
    const form = document.querySelector("#form");
    const input = document.querySelector("#input");
    const suggestions = document.querySelector("#suggestions");
    const status = document.querySelector("#status");

    function addBubble(text, kind = "bot") {
      const div = document.createElement("div");
      div.className = `bubble ${kind === "user" ? "user" : ""}`;
      div.textContent = text;
      chat.insertBefore(div, suggestions);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    async function ask(query) {
      const q = query.trim();
      if (!q) return;
      addBubble(q, "user");
      input.value = "";
      suggestions.innerHTML = "";
      status.textContent = "Ищу в базе Целебника...";
      try {
        const response = await fetch(`/api/answer?q=${encodeURIComponent(q)}`);
        const json = await response.json();
        addBubble(json.text || "Не нашел ответ.");
        status.textContent = json.matchType === "none" ? "Попробуйте другой запрос." : `Найдено: ${json.title}`;
      } catch (error) {
        addBubble("Не удалось получить ответ. Проверьте, что сервер запущен через npm run dev.");
        status.textContent = error.message;
      }
    }

    async function updateSuggestions(query) {
      if (!query.trim()) {
        suggestions.innerHTML = "";
        return;
      }
      try {
        const response = await fetch(`/api/suggest?q=${encodeURIComponent(query)}`);
        const json = await response.json();
        suggestions.innerHTML = json.suggestions.map((item) => `<button type="button" data-query="${item.title}">${item.title}</button>`).join("");
      } catch {
        suggestions.innerHTML = "";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      ask(input.value);
    });

    input.addEventListener("input", () => updateSuggestions(input.value));

    document.body.addEventListener("click", (event) => {
      const button = event.target.closest("[data-query]");
      if (!button) return;
      ask(button.dataset.query);
    });
  </script>
</body>
</html>
