  <title id="title">Поясница: наклон таза</title>
  <desc id="desc">Два кадра лежа: исходное положение и мягкое подкручивание таза.</desc>
  <rect width="960" height="540" fill="#f7fbf5"/>
  <rect x="48" y="48" width="864" height="444" rx="22" fill="#ffffff" stroke="#d9e7dc" stroke-width="2"/>
