<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Целебник</title>
  <style>
    :root {
      --ink: #16231d;
      --muted: #64736c;
      --leaf: #2c7a58;
      --leaf-dark: #1f533f;
      --leaf-soft: #e6f2df;
      --paper: #fffdf5;
      --bot: #ffffff;
      --user: #dff7cb;
      --line: #d8e0d7;
      --warn: #fff3e8;
      --shadow: 0 18px 44px rgba(22, 35, 29, .16);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(236, 244, 233, .86), rgba(236, 244, 233, .92)),
        url("https://images.unsplash.com/photo-1543362906-acfc16c67564?auto=format&fit=crop&w=1200&q=80");
      background-size: cover;
      background-position: center;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .phone {
      width: min(100%, 390px);
      height: min(760px, calc(100vh - 36px));
      min-height: 620px;
      border: 7px solid #14231b;
      border-radius: 32px;
      overflow: hidden;
      background: #dcead8;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      height: 72px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #fff;
      background: var(--leaf-dark);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: var(--leaf-dark);
      background: #fff8df;
      font-size: 26px;
      font-weight: 900;
    }

    .title {
      margin: 0 0 2px;
      font-size: 19px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: #d7eadc;
      font-size: 12px;
      line-height: 1.25;
    }

    .chat {
      position: relative;
      min-height: 0;
      padding: 14px 12px 84px;
      overflow-y: auto;
      background:
        linear-gradient(rgba(220, 234, 216, .9), rgba(220, 234, 216, .94)),
        url("https://images.unsplash.com/photo-1515586000433-45406d8e6662?auto=format&fit=crop&w=900&q=80");
      background-size: cover;
      background-position: center;
    }

    .message {
      width: fit-content;
      max-width: 94%;
      margin: 8px 0;
      padding: 12px 13px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.38;
      white-space: pre-wrap;
      box-shadow: 0 5px 18px rgba(22, 35, 29, .08);
    }

    .message.bot {
      background: var(--bot);
      border-top-left-radius: 5px;
    }

    .message.user {
      margin-left: auto;
      background: var(--user);
      border-top-right-radius: 5px;
    }

    .message h1,
    .message h2,
    .message h3 {
      margin: 0 0 7px;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .message p {
      margin: 0 0 8px;
    }

    .message p:last-child { margin-bottom: 0; }

    .note {
      color: var(--muted);
      font-size: 13px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 8px;
      max-width: 94%;
    }

    .quick-grid .wide { grid-column: 1 / -1; }

    button {
      font: inherit;
      cursor: pointer;
    }

    .quick {
      min-height: 44px;
      border: 0;
      border-radius: 9px;
      padding: 9px 10px;
      color: #fff;
      background: #4f9a77;
      font-weight: 800;
      line-height: 1.15;
    }

    .quick.alt {
      color: var(--leaf-dark);
      background: rgba(255, 255, 255, .86);
      border: 1px solid #cfe2cf;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 7px 0 8px;
      max-width: 94%;
    }

    .chip {
      border: 1px solid #cfe2cf;
      border-radius: 999px;
      padding: 8px 10px;
      color: var(--leaf-dark);
      background: rgba(255, 255, 255, .9);
      font-size: 13px;
      font-weight: 700;
    }

    .answer {
      padding: 0;
      overflow: hidden;
    }

    .answer-head {
      padding: 12px 13px;
      color: #fff;
      background: var(--leaf-dark);
    }

    .answer-head strong {
      display: block;
      margin-bottom: 2px;
      font-size: 16px;
    }

    .answer-head span {
      color: #d7eadc;
      font-size: 12px;
    }

    .answer-body {
      padding: 12px 13px;
      background: var(--bot);
    }

    .section {
      margin: 0 0 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffdf8;
    }

    .section:last-child { margin-bottom: 0; }

    .section-title {
      display: block;
      margin-bottom: 7px;
      color: var(--leaf-dark);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .section.warn {
      border-color: #ecc9ab;
      background: var(--warn);
    }

    .line {
      margin: 0 0 6px;
    }

    .line:last-child { margin-bottom: 0; }

    .illustration-card {
      margin: 0 0 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fbf6;
    }

    .illustration-card img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    .illustration-caption {
      margin: 0;
      padding: 9px 10px 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .inputbar {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 8px;
      padding: 8px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 8px 24px rgba(22, 35, 29, .11);
    }

    .inputbar input {
      width: 100%;
      min-width: 0;
      border: 0;
      border-radius: 20px;
      padding: 12px 14px;
      outline: 0;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 15px;
    }

    .send {
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--leaf);
      font-size: 22px;
      font-weight: 900;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 430px) {
      .shell { padding: 0; }
      .phone {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="phone" aria-label="Целебник Telegram Mini App">
      <header class="topbar">
        <div class="avatar">Ц</div>
        <div>
          <h1 class="title">Целебник</h1>
          <p class="subtitle">Здоровье и энергия доступные всем</p>
        </div>
      </header>

      <div class="chat" id="chat">
        <article class="message bot">
          <h2>Здравствуйте, я Целебник</h2>
          <p>Помогаю мягко улучшать самочувствие шеи, плеч, спины и поясницы через короткие программы, трекинг и полезные привычки.</p>
          <p class="note">Не ставлю диагнозы и не заменяю врача. При тревожных признаках подскажу, когда лучше не тянуть.</p>
        </article>

        <div class="quick-grid" aria-label="Главные входы">
          <button class="quick wide" data-query="болит шея">Шея и плечи</button>
          <button class="quick" data-query="спина после сидения">Спина</button>
          <button class="quick" data-query="ноет поясница">Поясница</button>
        </div>

        <div class="suggestions" id="examples">
          <button class="chip" data-query="зажаты плечи">зажаты плечи</button>
          <button class="chip" data-query="шея после компьютера">шея после компьютера</button>
          <button class="chip" data-query="утренняя скованность">утренняя скованность</button>
          <button class="chip" data-query="микропауза">микропауза</button>
        </div>

        <div class="suggestions" id="suggestions" hidden></div>

        <form class="inputbar" id="form">
          <input id="query" type="text" autocomplete="off" placeholder="Сообщение" aria-label="Сообщение">
          <button class="send" type="submit" aria-label="Отправить">›</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    const chat = document.querySelector("#chat");
    const form = document.querySelector("#form");
    const input = document.querySelector("#query");
    const suggestions = document.querySelector("#suggestions");

    const sectionNames = [
      "Народные рецепты:",
      "Программа 1-7 дней:",
      "Продукты и напитки:",
      "Восстановление:",
      "Упражнения и действия:",
      "Работа с симптомами:",
      "Трекинг и адаптация:",
      "Когда не тянуть:",
      "Осторожно:",
      "Источники:",
      "Рецепт / форма:",
      "Как применять:",
      "Как делать:",
      "Почему может работать:",
      "Что отслеживать:"
    ];

    function scrollDown() {
      requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
      });
    }

    function addMessage(text, who = "bot", extraClass = "") {
      const article = document.createElement("article");
      article.className = `message ${who} ${extraClass}`.trim();
      article.textContent = text;
      chat.insertBefore(article, form);
      scrollDown();
      return article;
    }

    function splitAnswer(text) {
      const lines = text.split("\n");
      const title = lines.shift() || "Целебник";
      const intro = [];
      const sections = [];
      let current = null;

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;

        if (sectionNames.includes(line)) {
          current = { title: line.replace(":", ""), lines: [] };
          sections.push(current);
          continue;
        }

        if (current) current.lines.push(line);
        else intro.push(line);
      }

      return { title, intro, sections };
    }

    function renderAnswer(payload) {
      const parsed = splitAnswer(payload.text || "");
      const article = document.createElement("article");
      article.className = "message bot answer";

      const head = document.createElement("div");
      head.className = "answer-head";
      head.innerHTML = `<strong>${escapeHtml(parsed.title)}</strong><span>${labelFor(payload.matchType)}</span>`;

      const body = document.createElement("div");
      body.className = "answer-body";

      if (parsed.intro.length) {
        body.appendChild(makeSection("Коротко", parsed.intro));
      }

      if (payload.illustration?.assetPath) {
        body.appendChild(makeIllustration(payload.illustration));
      }

      for (const section of parsed.sections) {
        const warn = section.title === "Когда не тянуть" || section.title === "Осторожно";
        body.appendChild(makeSection(section.title, section.lines, warn));
      }

      article.appendChild(head);
      article.appendChild(body);
      chat.insertBefore(article, form);
      scrollDown();
    }

    function makeSection(title, lines, warn = false) {
      const box = document.createElement("div");
      box.className = warn ? "section warn" : "section";
      const heading = document.createElement("strong");
      heading.className = "section-title";
      heading.textContent = title;
      box.appendChild(heading);

      for (const line of lines) {
        const p = document.createElement("p");
        p.className = "line";
        p.textContent = line.replace(/^- /, "• ");
        box.appendChild(p);
      }
      return box;
    }

    function makeIllustration(illustration) {
      const box = document.createElement("figure");
      box.className = "illustration-card";

      const img = document.createElement("img");
      img.src = illustration.assetPath;
      img.alt = illustration.title || "Схема упражнения";
      img.loading = "lazy";
      box.appendChild(img);

      const caption = document.createElement("figcaption");
      caption.className = "illustration-caption";
      caption.textContent = illustration.textCue || illustration.title || "";
      box.appendChild(caption);

      return box;
    }

    function labelFor(type) {
      if (type === "symptom") return "Что болит?";
      if (type === "remedy") return "Целебное средство";
      if (type === "action") return "Упражнение / действие";
      if (type === "program") return "Программа";
      return "Поиск по базе";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function sendQuery(query) {
      const clean = query.trim();
      if (!clean) return;

      input.value = "";
      suggestions.hidden = true;
      addMessage(clean, "user");

      const loading = addMessage("Ищу в базе: рецепты, действия, осторожность и источники...", "bot", "status");
      try {
        const response = await fetch(`/api/answer?q=${encodeURIComponent(clean)}`);
        const payload = await response.json();
        loading.remove();
        renderAnswer(payload);
      } catch (error) {
        loading.textContent = "Не получилось получить ответ от сервера. Проверьте, что запущен npm run dev.";
      }
    }

    async function updateSuggestions(query) {
      const clean = query.trim();
      if (clean.length < 2) {
        suggestions.hidden = true;
        suggestions.innerHTML = "";
        return;
      }

      try {
        const response = await fetch(`/api/suggest?q=${encodeURIComponent(clean)}`);
        const payload = await response.json();
        suggestions.innerHTML = "";
        for (const item of payload.suggestions || []) {
          const button = document.createElement("button");
          button.className = "chip";
          button.type = "button";
          button.textContent = item.title;
          button.addEventListener("click", () => sendQuery(item.title));
          suggestions.appendChild(button);
        }
        suggestions.hidden = suggestions.children.length === 0;
      } catch (error) {
        suggestions.hidden = true;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendQuery(input.value);
    });

    input.addEventListener("input", () => updateSuggestions(input.value));

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-query]");
      if (!button) return;
      sendQuery(button.dataset.query);
    });
  </script>
</body>
</html>
